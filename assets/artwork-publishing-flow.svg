<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="t d">
<title id="t">Artwork publishing workflow</title><desc id="d">Artwork must pass rights review, metadata inspection, alt text, asset path validation and browser testing before publication.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#202d3f"/></linearGradient><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#9fb6da"/></marker></defs>
<rect width="1400" height="460" rx="24" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f8fafc">
<text x="65" y="72" font-size="32" font-weight="700">Artwork publishing workflow</text>
<g stroke="#9fb6da" stroke-width="3" fill="none" marker-end="url(#m)"><path d="M230 240 H290"/><path d="M510 240 H570"/><path d="M790 240 H850"/><path d="M1070 240 H1130"/></g>
<g><rect x="55" y="175" width="175" height="130" rx="14" fill="#354967" stroke="#9fb6da" stroke-width="2"/><text x="142" y="226" text-anchor="middle" font-size="20" font-weight="700">Propose</text><text x="142" y="258" text-anchor="middle" font-size="16">Artwork file</text>
<rect x="290" y="175" width="220" height="130" rx="14" fill="#5b3e48" stroke="#e8a0a8" stroke-width="2"/><text x="400" y="220" text-anchor="middle" font-size="20" font-weight="700">Verify rights</text><text x="400" y="253" text-anchor="middle" font-size="16">Source + license</text><text x="400" y="278" text-anchor="middle" font-size="16">Attribution</text>
<rect x="570" y="175" width="220" height="130" rx="14" fill="#27564e" stroke="#7dd4b5" stroke-width="2"/><text x="680" y="220" text-anchor="middle" font-size="20" font-weight="700">Inspect asset</text><text x="680" y="253" text-anchor="middle" font-size="16">Metadata + size</text><text x="680" y="278" text-anchor="middle" font-size="16">Alt text</text>
<rect x="850" y="175" width="220" height="130" rx="14" fill="#4b426b" stroke="#b9a8e8" stroke-width="2"/><text x="960" y="220" text-anchor="middle" font-size="20" font-weight="700">Integrate</text><text x="960" y="253" text-anchor="middle" font-size="16">Add image path</text><text x="960" y="278" text-anchor="middle" font-size="16">Update inventory</text>
<rect x="1130" y="175" width="220" height="130" rx="14" fill="#354967" stroke="#9fb6da" stroke-width="2"/><text x="1240" y="220" text-anchor="middle" font-size="20" font-weight="700">Validate</text><text x="1240" y="253" text-anchor="middle" font-size="16">Browser + CI</text><text x="1240" y="278" text-anchor="middle" font-size="16">Publish</text></g>
<text x="65" y="380" font-size="17" fill="#bdc9dc">If source, license, or redistribution permission cannot be verified, do not publish the artwork.</text>
</g></svg>