<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="t d">
<title id="t">Art Gallery visitor journey</title><desc id="d">Visitor opens home gallery, browses carousel, then navigates to About or Media pages.</desc>
