<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="t d">
<title id="t">Art Gallery architecture overview</title><desc id="d">Three static HTML pages use local styles, carousel code and images, with external CDN and widget dependencies.</desc>
