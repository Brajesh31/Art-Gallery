name: Static site quality checks

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**.css"
      - "**.js"
      - "**.md"
      - "**.svg"
      - "images/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.html"
      - "**.css"
      - "**.js"
      - "**.md"
      - "**.svg"
      - "images/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site and repository documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run validator unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate HTML, CSS, Markdown links, and SVG assets
        run: python scripts/validate_repository.py
