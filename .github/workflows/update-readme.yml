name: README documentation checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "assets/**"
      - ".github/workflows/update-readme.yml"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "assets/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: read

concurrency:
  group: readme-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    name: Check README documentation entry points
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate README assets and documentation links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md")
          required = [
              "assets/art-gallery-banner.svg",
              "assets/architecture-overview.svg",
              "assets/visitor-journey.svg",
              "assets/artwork-publishing-flow.svg",
              "docs/README.md",
              "docs/demo.md",
          ]
          if not readme.is_file():
              raise SystemExit("README.md is missing")
          content = readme.read_text(encoding="utf-8")
          if content.count("![") < 8:
              raise SystemExit("README should display the banner and visual/status badges")
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("Missing README-linked assets or guides: " + ", ".join(missing))
          if "Local demo guide" not in content:
              raise SystemExit("README must explain the current local demo status")
          print("README documentation entry points and visual assets are present.")
          PY
